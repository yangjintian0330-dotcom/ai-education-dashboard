pan>使用学校数</span></div>\n      <div class=\"metric\"><strong id=\"teachers\">752</strong><em>人</em><span>活跃老师数</span></div>\n      <div class=\"metric\"><strong id=\"tasks\">28,940</strong><em>个</em><span>AI 生成任务数量</span></div>\n      <div class=\"metric\"><strong id=\"services\">104,752</strong><em>次</em><span>AI 对话次数</span></div>\n      <div class=\"metric\"><strong id=\"resources\">7,760</strong><em>份</em><span>区域资源沉淀</span></div>\n    </section>\n\n    <section class=\"grid\">\n      <aside class=\"side\">\n        <article class=\"panel trend\">\n          <div class=\"phead\"><h2>区域使用趋势</h2><div class=\"tabset\"><button class=\"on\" data-mode=\"student\">学生</button><button data-mode=\"teacher\">教师</button></div></div>\n          <div id=\"trend\" class=\"chart\"></div>\n        </article>\n        <article class=\"panel capability school-metric\">\n          <div class=\"phead\"><h2>学校使用老师数</h2></div>\n          <div id=\"school-teacher-list\" class=\"cap-list\"></div><div id=\"school-teacher-list-pager\" class=\"pager\"></div>\n        </article>\n        <article class=\"panel capability\">\n          <div class=\"phead\"><h2>高频 AI 能力</h2></div>\n          <div id=\"cap-list\" class=\"cap-list\"></div><div id=\"cap-list-pager\" class=\"pager\"></div>\n        </article>\n      </aside>\n\n      <section class=\"command\">\n        <div class=\"map-shell\">\n          <div id=\"amap\" class=\"amap\"></div>\n          <div class=\"map-label\">飞象老师校园版实时活跃</div>\n          <div class=\"map-stats\"><strong>23</strong><div><b>所中学</b><span>实时活跃</span></div></div>\n          <a class=\"map-panorama\" href=\"#\" onclick=\"parent.showView('future');return false\" aria-label=\"进入西城区 AI 教育未来城全景\">看全景 <span aria-hidden=\"true\">↗</span></a>\n          <div id=\"link-feed\" class=\"link-feed\"></div>\n        </div>\n        <div class=\"ledger\">\n          <article class=\"panel rank\"><div class=\"phead\"><h2>学校累计创作指数</h2></div><div id=\"school-rank\" class=\"rank-list\"></div></article>\n          <article class=\"panel rank\"><div class=\"phead\"><h2>教师资源贡献榜</h2></div><div id=\"teacher-rank\" class=\"rank-list\"></div></article>\n        </div>\n      </section>\n\n      <aside class=\"side right-focus\">\n        <article class=\"panel capability school-metric\">\n          <div class=\"phead\"><h2>学校对话次数</h2></div>\n          <div id=\"school-dialogue-list\" class=\"cap-list\"></div><div id=\"school-dialogue-list-pager\" class=\"pager\"></div>\n        </article>\n        <article class=\"panel capability school-metric\">\n          <div class=\"phead\"><h2>学校生成任务数</h2></div>\n          <div id=\"school-task-list\" class=\"cap-list\"></div><div id=\"school-task-list-pager\" class=\"pager\"></div>\n        </article>\n        <article class=\"panel usage\"><div class=\"phead\"><h2>区域热门 AI 应用</h2></div><div id=\"hot-apps\" class=\"hot-apps\"></div></article>\n        <article class=\"panel resource-panel subject\"><div class=\"phead\"><h2>区域资源类型雷达</h2><label id=\"type-total\"></label></div><div class=\"subject-body\"><div id=\"type-chart\" class=\"subject-chart\"></div><div id=\"type-legend\" class=\"legend\"></div></div></article>\n        <article class=\"panel resource-panel resource-subject\"><div class=\"phead\"><h2>区域资源学科雷达</h2><label>按学科分类 · 份</label></div><div id=\"subject-chart\" class=\"resource-subject-chart\"></div></article>\n      </aside>\n    </section>\n  </main>\n  <div id=\"floating\" class=\"floating\"></div>\n\n  <script>\n    const $ = id => document.getElementById(id);\n    const fmt = value => Math.round(value).toLocaleString();\n    const today = new Date();\n    today.setHours(0, 0, 0, 0);\n    const data = Array.from({length: 90}, (_, index) => {\n      const date = new Date(today);\n      date.setDate(today.getDate() - 89 + index);\n      const student = Math.max(1300, 3000 + Math.round(Math.sin(index / 7) * 840 + index * 14 + (index % 7) * 170));\n      const teacher = Math.max(90, 205 + Math.round(Math.sin(index / 4.8) * 48 + Math.cos(index / 10) * 26 + index * 2.15 + (index % 6) * 11));\n      return {date, student, teacher, tasks: Math.round(student * .92), services: Math.round(student * 5.65)};\n    });\n    const capabilityBase = [\n      ['AI 生成题目', 386, '#2dd4b5'], ['AI 生成动画', 324, '#32c5f4'], ['知识库问答', 308, '#f8b840'],\n      ['AI 生成游戏', 268, '#e27090'], ['AI 生成课件', 256, '#9e82ff'], ['AI 分析作文', 228, '#2dd4b5']\n    ];\n    const schoolTeacherBase = [\n      ['北京市第四中学', 86, '#2dd4b5'], ['北京市第八中学', 75, '#32c5f4'], ['北京市第三十五中学', 66, '#f8b840'],\n      ['北京市第一六一中学', 58, '#e27090'], ['北京市第十五中学', 51, '#9e82ff'], ['北京市第十四中学', 44, '#2dd4b5']\n    ];\n    const schoolDialogueBase = [\n      ['北京市第四中学', 968, '#2dd4b5'], ['北京市第八中学', 844, '#32c5f4'], ['北京市第三十五中学', 731, '#f8b840'],\n      ['北京市第一六一中学', 642, '#e27090'], ['北京市第十五中学', 570, '#9e82ff'], ['北京市第十四中学', 498, '#2dd4b5']\n    ];\n    const schoolTaskBase = [\n      ['北京市第四中学', 608, '#2dd4b5'], ['北京市第八中学', 530, '#32c5f4'], ['北京市第三十五中学', 452, '#f8b840'],\n      ['北京市第一六一中学', 404, '#e27090'], ['北京市第十五中学', 360, '#9e82ff'], ['北京市第十四中学', 319, '#2dd4b5']\n    ];\n    const appsBase = [\n      ['西城智教 AI 作文陪练', 36146, '作文构思、分层陪练与表达提升使用最集中。'],\n      ['智能作业批改', 29229, '语文与数学作业是最主要场景。'],\n      ['几何助教', 10605, '几何图形推演、辅助作图与错题讲解最活跃。'],\n      ['拍照答疑', 9652, '晚间时段的错题提问更集中。'],\n      ['AI 视频讲解', 6946, '重点服务难题复盘和知识点巩固。']\n    ];\n    const schools = [\n      ['北京市第十三中学',116.3850,39.9420],['北京市第六十六中学',116.3630,39.8890],['北京市第三十一中学',116.3790,39.9060],['北京市第一六一中学',116.3750,39.8840],['北京市第三中学',116.3650,39.9370],['北京市第一五六中学',116.3760,39.9360],['北京北京教育学院附属中学',116.3670,39.9490],['北京市第三十九中学',116.3750,39.9330],['北京市第四十四中学',116.3430,39.9090],['北京市第十四中学',116.3330,39.8950],['北京市第一五九中学',116.3560,39.9180],['北京市第八中学',116.3610,39.9160],['北京市第十五中学',116.3740,39.8790],['北京师范大学附属实验中学',116.3500,39.9230],['北京师范大学第二附属中学',116.3720,39.9590],['北京市第四十三中学',116.3750,39.9000],['北京市三帆中学',116.3800,39.9570],['北京市第三十五中学(初中)',116.3650,39.9350],['北京市回民学校',116.3570,39.8860],['北京市铁路第二中学',116.3290,39.9050],['北京市西城外国语学校',116.3290,39.9340],['北京市第四中学',116.3746,39.9319],['北京市月坛中学',116.3540,39.9100]\n    ];\n    let mode = 'student';\n    let activeDays = 7;\n    let selectedStart = new Date(today); selectedStart.setDate(today.getDate() - 6);\n    let selectedEnd = new Date(today);\n    let trendChart, typeChart, subjectChart;\n\n    function selectedData() { return data.filter(row => row.date >= selectedStart && row.date <= selectedEnd); }\n    function dateValue(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }\n    function shortDate(date) { return `${date.getMonth()+1}.${date.getDate()}`; }\n    function scaleFor(days) { return .5 + Math.min(1, days / 90) * .5; }\n    function animateNumber(id, target) {\n      const element = $(id);\n      const from = Number(element.dataset.value || 0);\n      const start = performance.now();\n      element.dataset.value = target;\n      const step = now => {\n        const progress = Math.min(1, (now - start) / 650);\n        element.textContent = fmt(from + (target - from) * (1 - Math.pow(1 - progress, 3)));\n        if (progress < 1) requestAnimationFrame(step);\n      };\n      requestAnimationFrame(step);\n    }\n    function floatingAt(event, title, value, body, tag = '数据洞察') {\n      const card = $('floating');\n      card.innerHTML = `<small>${tag}</small><b>${title}<i>${value}</i></b><p>${body}</p>`;\n      const width = 318;\n      card.style.left = `${Math.max(14, Math.min(event.clientX + 16, innerWidth - width - 14))}px`;\n      card.style.top = `${Math.max(14, Math.min(event.clientY - 20, innerHeight - 180))}px`;\n      card.classList.add('show');\n    }\n    function hideFloating() { $('floating').classList.remove('show'); }\n\n    const pageState = {};\n    function renderPagedMetric(listId, values, unit, tag) {\n      const pageSize = 3;\n      const pages = Math.max(1, Math.ceil(values.length / pageSize));\n      const page = Math.min(pageState[listId] || 0, pages - 1);\n      pageState[listId] = page;\n      const max = Math.max(...values.map(([, value]) => value));\n      const total = values.reduce((sum, [, value]) => sum + value, 0);\n      const visible = values.slice(page * pageSize, (page + 1) * pageSize);\n      $(listId).innerHTML = visible.map(([name, value, color], localIndex) => {\n        const index = page * pageSize + localIndex;\n        return `<div class=\"cap-row\" data-index=\"${index}\"><span class=\"cap-order\">0${index + 1}</span><span class=\"cap-name\">${name}</span><i class=\"cap-track\"><b class=\"cap-fill\" style=\"--color:${color};width:${Math.round(value / max * 100)}%\"></b></i><span class=\"cap-value\"><b>${fmt(value)}</b>${unit} · ${Math.round(value / total * 100)}%</span></div>`;\n      }).join('');\n      const pager = $(`${listId}-pager`);\n      pager.innerHTML = `<button class=\"pager-btn\" data-page=\"${page - 1}\" aria-label=\"上一页\" ${page === 0 ? 'disabled' : ''}>‹</button><span class=\"pager-dots\">${Array.from({length:pages},(_,index)=>`<button class=\"pager-dot ${index===page?'on':''}\" data-page=\"${index}\" aria-label=\"第 ${index+1} 页\"></button>`).join('')}</span><button class=\"pager-btn\" data-page=\"${page + 1}\" aria-label=\"下一页\" ${page === pages - 1 ? 'disabled' : ''}>›</button>`;\n      pager.querySelectorAll('[data-page]').forEach(button => button.onclick = () => { const next = Number(button.dataset.page); if (next < 0 || next >= pages || next === page) return; pageState[listId] = next; renderPagedMetric(listId, values, unit, tag); });\n      document.querySelectorAll(`#${listId} .cap-row`).forEach((row, localIndex) => {\n        const [name, value] = visible[localIndex];\n        row.onmouseenter = event => floatingAt(event, name, `${fmt(value)} ${unit}`, `${tag}，占榜单总量的 ${Math.round(value / total * 100)}%。`, tag);\n        row.onmousemove = event => floatingAt(event, name, `${fmt(value)} ${unit}`, tag, tag);\n        row.onmouseleave = hideFloating;\n      });\n    }\n    function renderCapabilities(period, scale) {\n      const values = capabilityBase.map(([name, value, color], index) => [name, Math.round(value * scale * (1 + (index - 2) * .012)), color]);\n      renderPagedMetric('cap-list', values, '次', 'AI 能力使用次数');\n    }\n    function renderSchoolMetric(listId, base, scale, unit, tag) {\n      const values = base.map(([name, value, color]) => [name, Math.round(value * scale), color]);\n      renderPagedMetric(listId, values, unit, tag);\n    }\n    function renderApps(period, scale) {\n      const values = appsBase.map(([name, value, copy], index) => [name, Math.round(value * scale * (1 + (index - 2) * .018)), copy]);\n      $('hot-apps').innerHTML = values.map(([name, value], index) => `\n        <div class=\"hot-app ${index === 0 ? 'hot-main' : ''}\" data-index=\"${index}\">\n          <span class=\"hot-rank\">${index === 0 ? '热门应用 01' : `0${index + 1}`}</span><span class=\"hot-name\">${name}</span>\n          <b class=\"hot-value\">${fmt(value)}<small>次</small></b>\n        </div>`).join('');\n      document.querySelectorAll('.hot-app').forEach((card, index) => {\n        const [name, value, copy] = values[index];\n        card.onmouseenter = event => floatingAt(event, name, `${fmt(value)} 次`, `${period}累计使用；${copy}`, '区域应用热度');\n        card.onmousemove = event => floatingAt(event, name, `${fmt(value)} 次`, `${period}累计使用；${copy}`, '区域应用热度');\n        card.onmouseleave = hideFloating;\n      });\n    }\n    function resourceTooltip(tag, title, value, copy) {\n      return `<span class=\"tip-tag\">${tag}</span><div class=\"tip-title\">${title}<i class=\"tip-value\">${value}</i></div><div>${copy}</div>`;\n    }\n    function updateResources(days) {\n      const scale = .82 + Math.min(1, days / 90) * .18;\n      const typeNames = ['题单', 'WIKI', '文件', '应用', '课件'];\n      const typeColors = ['#9e82ff', '#32c5f4', '#f8de58', '#d66ac5', '#2dd4b5'];\n      const typeValues = [2860, 1840, 1360, 920, 780].map((value, index) => Math.round(value * scale * (1 + (index - 2) * .015)));\n      const typeTotal = typeValues.reduce((sum, value) => sum + value, 0);\n      $('type-total').textContent = `${fmt(typeTotal)} 份`;\n      $('type-legend').innerHTML = typeNames.map((name, index) => `<span>${name} ${fmt(typeValues[index])}</span>`).join('');\n      typeChart.setOption({\n        title: {text: fmt(typeTotal)},\n        series: [{data: typeNames.map((name, index) => ({name, value: typeValues[index], itemStyle: {color: typeColors[index]}}))}]\n      });\n      const profiles = {\n        7: [2080,2140,2010,1860,2820,2980,1740,1680],\n        30: [2360,2980,2440,2150,2090,2230,1810,1650],\n        90: [3000,2640,2520,2280,2200,2390,1940,1810]\n      };\n      const profile = days <= 18 ? 7 : days <= 60 ? 30 : 90;\n      const subjectNames = ['语文','数学','外语','物理','化学','跨学科案例分析','道德与法治','历史'];\n      const values = profiles[profile];\n      const total = values.reduce((sum, value) => sum + value, 0);\n      const leaderIndex = values.indexOf(Math.max(...values));\n      const conclusion = profile === 7 ? '跨学科案例分析与化学在短周期内活跃度最高。' : profile === 30 ? '数学在月度资源沉淀中占据主导。' : '语文在季度资源沉淀中占据主导。';\n      subjectChart.setOption({\n        tooltip: {formatter: () => resourceTooltip('学科资源洞察', '区域资源学科分布', `共 ${fmt(total)} 份`, `近 ${days} 天内，<strong>${subjectNames[leaderIndex]}</strong>资源沉淀最突出，为 <strong>${fmt(values[leaderIndex])}</strong> 份。<br/>${conclusion}`)},\n        series: [{data: [{value: values}]}]\n      });\n    }\n    function renderRanks(scale) {\n      const schoolRows = [\n        ['北京市第四中学', '已累计沉淀 42 项资源：4 个教学应用、17 份题单、12 套课件及 9 份校本文件。'],\n        ['北京市第八中学', '已累计沉淀 38 项资源，其中「错因追踪」应用被 7 所学校复用。'],\n        ['北京市第三十五中学', '已累计沉淀 31 项跨学科资源包，覆盖课件、任务单与课堂活动。'],\n        ['北京市第一六一中学', '已累计沉淀 29 项科学探究资源，「实验报告生成器」覆盖多个年级。'],\n        ['北京市第十五中学', '已累计沉淀 26 项知识库问答与课堂讲解资源。'],\n        ['北京市第十四中学', '已累计沉淀 22 项英语教学资源，含游戏、题单和评价量表。']\n      ];\n ]}\"><div><strong>${event[0]}</strong>${event[1]}</div><time>${index===0?'刚刚':index===1?'1 分钟前':'2 分钟前'}</time></div>`).join('');if(animate)requestAnimationFrame(()=>requestAnimationFrame(()=>feed.lastElementChild?.classList.remove('entering')));}\n    function advanceLiveFeed(){liveEventCursor=(liveEventCursor+1)%liveEvents.length;renderLiveFeed(true);showSchoolEvent(liveEvents[liveEventCursor]);}\n    renderLiveFeed();setInterval(advanceLiveFeed,4800);\n    function normalized(name){return name.replace('北京市西城区','').replace('上海市','').replace('初级中学','').replace('中学','').replace('学校','学校');}\n    function schoolDeposit(i){return deposits[schools[i][0]] || Math.max(8,18+(i*7)%21);}\n    function towerContent(i){const d=modes[mode],period=.5+activeDays/180,base=31+(i*17)%83,level=hotSchools.has(i)?'hot':liveSchools.has(i)?'active':'idle',scale=level==='hot'?1.62:level==='active'?1.12:.54,h=Math.round(base*d.factor*period*scale),c=d.colors[i%3],short=schools[i][0].replace('北京市西城区','').replace('上海市','');return `<div class=\"tower ${level} ${selectedSchool===i?'selected':''}\" style=\"--h:${h}px;--c:${c};--delay:-${(i*.19).toFixed(2)}s\" aria-label=\"${schools[i][0]}\"><i class=\"beam\"></i><i class=\"base\"></i><i class=\"pulse\"></i><i class=\"pulse\"></i><span class=\"school-mini\">${short}</span></div>`;}\n    function eventCapsuleContent(event,index){const side=schools[index][1]>=overviewCenter[0]?'side-left':'side-right';return `<div class=\"school-event-anchor ${side}\"><div class=\"school-event-capsule\" style=\"--event-color:${event[2]}\"><span>实时 · ${event[0]}</span><strong>${event[1]}</strong></div></div>`;}\n    function showSchoolEvent(event){if(!map)return;const index=schools.findIndex(s=>s[0]===event[0]);if(index<0)return;const position=[schools[index][1],schools[index][2]],content=eventCapsuleContent(event,index);clearTimeout(eventHideTimer);if(!eventMarker){eventMarker=new AMap.Marker({position,content,anchor:'bottom-left',offset:new AMap.Pixel(0,-32),zIndex:520,clickable:false,bubble:true});eventMarker.setMap(map);}else{eventMarker.setPosition(position);eventMarker.setContent(content);eventMarker.show();}eventHideTimer=setTimeout(()=>eventMarker?.hide(),3400);}\n    function selectSchool(next){const previous=selectedSchool;selectedSchool=next;if(previous>=0&&towerMarkers[previous])towerMarkers[previous].setContent(towerContent(previous));if(next>=0&&next!==previous&&towerMarkers[next])towerMarkers[next].setContent(towerContent(next));}\n    function clearFocusWait(){clearTimeout(focusCardTimer);focusCardTimer=null;if(focusEndHandler&&map){map.off('moveend',focusEndHandler);focusEndHandler=null;}}\n    function openSchoolDashboard(name){\n      if(window.parent!==window&&typeof window.parent.showView==='function'){window.parent.showView('school',name);return;}\n      window.open('school-dashboard.html?school='+encodeURIComponent(name),'_blank','noopener');\n    }\n    function returnToRegionalDashboard(){\n      if(window.parent!==window&&typeof window.parent.showView==='function'){window.parent.return;}\n      if(history.length>1)history.back();\n    }\n    function card(i){const s=schools[i],teachers=20+i*3,uses=Math.round((38+i*17)*activeDays/7),resources=Math.round((46+i*13)*(.82+activeDays/500)),deposit=schoolDeposit(i),action=`<button type=\"button\" onclick='openSchoolDashboard(${JSON.stringify(s[0])})'>进入学校驾驶舱 →</button>`;return `<article class=\"school-card\"><button class=\"card-close\" onclick=\"closeSchoolCard()\" aria-label=\"关闭学校详情\">×</button><span class=\"tag\">学校节点 / ${String(i+1).padStart(2,'0')}</span><h3>${s[0]}</h3><div class=\"grid\"><span>活跃教师<b>${teachers}</b></span><span>${modes[mode].label}<b>${uses}</b></span><span>资源复用<b>${resources}</b></span><span>资源沉淀<b>${deposit} 项</b></span></div>${action}</article>`;}\n    function renderSchoolTowers(boundaries){schools.filter(s=>boundaries.some(path=>AMap.GeometryUtil.isPointInRing([s[1],s[2]],path))).forEach((s,i)=>{const marker=new AMap.Marker({position:[s[1],s[2]],content:towerContent(i),offset:new AMap.Pixel(0,0),zIndex:200+i});marker.on('click',()=>focusSchool(i));marker.setMap(map);towerMarkers.push(marker);});} function styleXichengBuildings(){AMap.plugin('AMap.DistrictSearch',()=>{const search=new AMap.DistrictSearch({extensions:'all',level:'district',subdistrict:0});search.search('110102',(status,result)=>{const boundaries=result?.districtList?.[0]?.boundaries||[];if(status!=='complete'||!boundaries.length){console.error('西城区行政边界加载失败');return;}if(buildingLayer)buildingLayer.setStyle({hideWithoutStyle:false,areas:boundaries.map(path=>({path,rejectTexture:true,color1:'ff1e4a8e',color2:'ff061438'}))});const districtTint=boundaries.map(path=>new AMap.Polygon({path,strokeOpacity:0,fillColor:'#2467e8',fillOpacity:.14,zIndex:70,bubble:true}));const edge=boundaries.map(path=>new AMap.Polygon({path,strokeColor:'#78b5ff',strokeOpacity:.7,strokeWeight:1.5,fillColor:'#2461c4',fillOpacity:0,zIndex:120,bubble:true}));map.add([...districtTint,...edge]);map.setFitView(edge,[40,40,40,40]);renderSchoolTowers(boundaries);});});}\n    function setOverviewButton(visible){document.getElementById('return-overview').classList.toggle('show',visible);}\n    function closeSchoolCard(){info?.close();}\n    function focusSchool(i){const s=schools[i],sequence=++focusSequence;clearFocusWait();setOverviewButton(true);info.close();selectSchool(i);const openCard=()=>{if(sequence!==focusSequence||selectedSchool!==i)return;clearFocusWait();info.setContent(card(i));info.open(map,[s[1],s[2]]);};focusEndHandler=()=>{clearTimeout(focusCardTimer);focusCardTimer=setTimeout(openCard,100);};focusCardTimer=setTimeout(openCard,2100);map.setZoomAndCenter(17.2,[s[1],s[2]],false,1800);map.on('moveend',focusEndHandler);}\n    function returnOverview(){focusSequence+=1;clearFocusWait();setOverviewButton(false);info.close();selectSchool(-1);map.setZoomAndCenter(13.6,overviewCenter,false,1600);}\n    function init(){\n      try{\n        map=new AMap.M     function groupTeachers(records,sort){return profiles.map((profile,id)=>{const own=records.filter(w=>w.teacher===id);return {id,profile,generated:own.length,views:own.reduce((n,w)=>n+w.views,0),favorites:own.reduce((n,w)=>n+w.favorites,0)}}).filter(x=>x.generated).sort((a,b)=>b[sort]-a[sort]||a.id-b.id)}

    const collaboration=document.createElement('section');collaboration.className='rv-panel ri-panel ri-collaboration';collaboration.setAttribute('aria-label','人机协同分析');ui.querySelector('.rv-columns').appendChild(collaboration);
    collaboration.innerHTML='<div class="rv-head"><h3>人机协同分析</h3></div><div class="ri-items"></div>';
    let insightKey='',insightTrigger=null;
    const evidenceDialog=document.createElement('dialog');evidenceDialog.className='rv-dialog';evidenceDialog.setAttribute('aria-label','对话证据与教研支持');document.body.appendChild(evidenceDialog);
    evidenceDialog.addEventListener('close',()=>insightTrigger?.isConnected&&insightTrigger.focus());
    function openEvidence(c){const w=works.find(w=>w.id===c.workId),p=profiles[c.teacher];evidenceDialog.innerHTML='<div class="rv-head"><h3>'+c.phase+' · '+c.label+'</h3><button type="button">关闭</button></div><div class="rv-dialog-body"><small>'+p[2]+' · '+p[4]+' · '+p[1]+' · 模拟对话</small><p>'+w.title+'</p>'+c.evidence.map(([role,text])=>'<article class="ri-dialogue"><b>'+role+'</b><p>'+text+'</p></article>').join('')+'<article class="rv-work"><strong>协同行为观察</strong><p>'+c.observation+'</p></article><article class="rv-work"><strong>教师人工智能培训</strong><p>'+c.training+'</p><strong>专业教研重点</strong><p>'+c.research+'</p><strong>专业资源建设重点</strong><p>'+c.resource+'</p></article></div>';evidenceDialog.querySelector('button').onclick=()=>evidenceDialog.close();evidenceDialog.showModal()}
    function renderInsights(records){const key=appliedFilters.join('|')+'|'+document.getElementById('date-start').value+'|'+document.getElementById('date-end').value;if(key!==insightKey){insightKey=key;if(evidenceDialog.open)evidenceDialog.close()}
      renderInsightPanel(records,insight,true);renderInsightPanel(records,collaboration,false);
    }
    function relatedCases(records,isContent){const ids=new Set(records.map(w=>w.id)),matches=collaborationCases.filter(c=>ids.has(c.workId));return (isContent?matches:matches.slice().sort((a,b)=>Number(b.teacher===4)-Number(a.teacher===4))).slice(0,2)}
    function openRelated(c,isContent){
      if(!c)return;
      evidenceDialog.className='rv-dialog cv-dialog';evidenceDialog.setAttribute('aria-labelledby','cv-title');evidenceDialog.removeAttribute('aria-label');evidenceDialog.dataset.fileOpen='false';evidenceDialog.innerHTML=conversationMarkup(c,profiles[c.teacher]);
      const preview=evidenceDialog.querySelector('#cv-preview'),transcript=evidenceDialog.querySelector('.cv-transcript');
      function hidePreview(){preview.hidden=true;evidenceDialog.dataset.fileOpen='false';evidenceDialog.querySelectorAll('[data-cv-file]').forEach(b=>b.setAttribute('aria-expanded','false'));evidenceDialog.querySelector('[data-cv-file][data-selected="true"]')?.focus()}
      evidenceDialog.querySelector('#cv-close').onclick=()=>evidenceDialog.close();
      evidenceDialog.querySelector('#cv-hide-preview').onclick=hidePreview;
      evidenceDialog.querySelectorAll('[data-cv-file]').forEach(b=>b.onclick=()=>{const file=(previewFiles[c.id]||[]).find(f=>f.id===b.dataset.cvFile);if(!file)return;evidenceDialog.querySelector('#cv-file-name').textContent=file.name;evidenceDialog.querySelector('.cv-preview-scroll').innerHTML=filePreviewMarkup(file);evidenceDialog.querySelector('.cv-preview-scroll').scrollTop=0;preview.hidden=false;evidenceDialog.dataset.fileOpen='true';evidenceDialog.querySelectorAll('[data-cv-file]').forEach(x=>{x.setAttribute('aria-expanded',String(x===b));x.dataset.selected=String(x===b)});evidenceDialog.querySelector('#cv-hide-preview').focus()});
      evidenceDialog.showModal();transcript.scrollTop=0;evidenceDialog.querySelector('#cv-close').focus();
    }
    // dialogue-pies:start
    function dialoguePieGroups(sessions){
      const directions=[['互动探究资源',/互动|拖动|探究|动画|游戏|滑块/],['练习与分层资源',/组题|题单|练习单|分层|八道题/],['表达与阅读资源',/写作|作文|阅读|原文|诗句|表达/],['评价反馈资源',/评价|成绩|反馈|学情/],['教学准备资源',/教案|备课|课件|教学设计/],['组织管理资源',/管理|班级|事务|分组/],['其他创作需求',null]];
      const stages=[['练习巩固',/课后|巩固|组题|题单|练习单|八道题/],['课堂导入',/导入|先放|比一比/],['探究与研讨',/探究|预测|拖动|滑块|追问|证据|解释/],['表达与实践',/写作|游戏|问路|表达|实验|学生自己/],['评价与反馈',/评价|成绩|反馈|修改/],['教学准备与组织',null]];
      const colors=['#a9c9f5','#ffe6a4','#f9c2db','#a9e1de','#b4e9c8','#ffcda9','#c9c4e8'];
      const texts=sessions.map(messages=>messages.filter(m=>m[0]==='教师').map(m=>m[1]).join('。'));
      return [directions,stages].map(catalog=>{const rows=catalog.map(([name],i)=>({name,value:0,color:colors[i]}));texts.forEach(text=>{const i=catalog.findIndex(([,rule])=>!rule||rule.test(text));rows[i].value++;});return rows.filter(r=>r.value);});
    }
    function dialoguePies(sessions){
      if(!sessions.length)return '<div class="empty rv-empty">当前筛选下暂无创作对话</div>';
      const groups=dialoguePieGroups(sessions),total=sessions.length;
      const css='<style>.dialogue-pies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;width:100%;min-width:0}.dialogue-pie{min-width:0;margin:0}.dialogue-pie h4{font-size:16px!important;line-height:1.5!important;color:#e4efff!important;margin:0 0 10px!important}.dialogue-pie svg{display:block;width:100%;height:clamp(100px,17vh,170px);margin:0 auto 10px}.dialogue-pie text{fill:#26394e;font:10px sans-serif;text-anchor:middle;dominant-baseline:middle}.dialogue-pie ul{list-style:none;padding:0;margin:0}.dialogue-pie li{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid #41617b33;font-size:11px;line-height:1.4;color:#abc2db}.dialogue-pie li i{width:6px;height:6px;border-radius:2px}.dialogue-pie li b{font-weight:500;color:#d4e5f6;font-size:10px;white-space:nowrap}.collaboration-caption{display:flex;justify-content:space-between;gap:8px;color:#8cd9e4;font-size:12px;margin:14px 0 6px}.collaboration-caption small{font-size:10px;color:#91a8c3}@media(max-width:620px){.dialogue-pies{grid-template-columns:1fr}.dialogue-pie svg{height:160px}}</style>';
      return css+'<div class="dialogue-pies">'+groups.map((rows,index)=>{
        let angle=-Math.PI/2;
        const paths=rows.map(row=>{const start=angle;angle+=row.value/total*Math.PI*2;const mid=(angle+start)/2,pct=(row.value/total*100).toFixed(1),title=row.name+'：'+row.value+' 次对话 · '+pct+'%';
          const d='M100 100 L'+(100+94*Math.cos(start))+' '+(100+94*Math.sin(start))+' A94 94 0 '+(angle-start>Math.PI?1:0)+' 1 '+(100+94*Math.cos(angle))+' '+(100+94*Math.sin(angle))+' Z';
          return (rows.length===1?'<circle cx="100" cy="100" r="94" fill="'+row.color+'"><title>'+title+'</title></circle>':'<path d="'+d+'" fill="'+row.color+'"><title>'+title+'</title></path>')+'<text x="'+(rows.length===1?100:100+60*Math.cos(mid))+'" y="'+(rows.length===1?100:100+60*Math.sin(mid))+'">'+Math.round(row.value/total*100)+'%</text>';
        }).join('');
        return '<figure class="dialogue-pie"><h4>'+['创作方向','教学环节支持方向'][index]+'</h4><svg viewBox="0 0 200 200" role="img" aria-label="'+['创作方向','教学环节支持方向'][index]+'，共'+total+'次对话">'+paths+'</svg><ul>'+rows.map(row=>'<li><i style="background:'+row.color+'"></i><span>'+row.name+'</span><b>'+row.value+' 次 · '+(row.value/total*100).toFixed(1)+'%</b></li>').join('')+'</ul></figure>';
      }).join('')+'</div>';
    }
    // dialogue-pies:end
    function renderInsightPanel(records,panel,isContent){
      if(isContent){const ids=new Set(records.map(w=>w.id));panel.querySelector('.ri-items').innerHTML=dialoguePies(collaborationCases.filter(c=>ids.has(c.workId)).map(c=>c.evidence));return;}
      const brief=isContent?contentAnalysisBrief(records):analysisBrief(records,false),related=relatedCases(records,isContent);
      panel.querySelector('.ri-items').innerHTML=brief?'<article class="ri-brief"><h4>'+brief.title+'</h4><p>'+brief.body+'</p>'+(isContent?'<h4 class="ri-teaching-title">教学环节支持方向</h4><p>'+brief.teachingBody+'</p>':'')+'<div class="ri-related" aria-label="相关案例">'+related.map(c=>{const p=profiles[c.teacher];return '<div class="ri-related-row"><button type="button" data-related-case="'+c.id+'" aria-haspopup="dialog">'+c.topic+' ↗</button><span>'+p[0]+' · '+p[1]+' · '+p[4]+p[2]+'</span></div>'}).join('')+'</div></article>':'<div class="rv-empty">当前筛选下暂无'+(isContent?'需求分析':'协同分析')+'</div>';
      const relatedBlock=panel.querySelector('.ri-related');if(relatedBlock)relatedBlock.insertAdjacentHTML('afterbegin','<div class="collaboration-caption"><b>优秀协同案例</b><small>点击查看对话过程 ↗</small></div>');
      panel.querySelectorAll('[data-related-case]').forEach(b=>b.onclick=()=>{insightTrigger=b;openRelated(related.find(c=>c.id===b.dataset.relatedCase),isContent)});
    }
    function baseWorks(){const from=document.getElementById('date-start').value,to=document.getElementById('date-end').value;return works.filter(w=>{const p=profiles[w.teacher];return w.date>=from&&w.date<=to&&(!appliedFilters[0]||p[4]===appliedFilters[0])&&(!appliedFilters[1]||p[2]===appliedFilters[1])&&(!appliedFilters[2]||p[1]===appliedFilters[2])})}
    function selectedWorks(){return baseWorks().filter(w=>!topic||w.theme===topic)}
    function paginate(prefix,current,total){ui.querySelector('#'+prefix+'-page').textContent=(current+1)+' / '+Math.max(1,total);ui.querySelector('#'+prefix+'-prev').disabled=current===0;ui.querySelector('#'+prefix+'-next').disabled=current>=total-1}
    function render(){const base=baseWorks(),records=base.filter(w=>!topic||w.theme===topic),rows=groupTeachers(records,sort),pages=Math.ceil(rows.length/pageSize);page=0;pageSize=Math.max(1,rows.length);renderInsights(base);
      ui.querySelector('#rv-rows').innerHTML=rows.slice(page*pageSize,(page+1)*pageSize).map((r,i)=>'<tr><td>'+String(page*pageSize+i+1).padStart(2,'0')+'</td><td><button type="button" class="rv-teacher" data-teacher="'+r.id+'">'+r.profile[0]+'</button><small title="'+r.profile[1]+'">'+r.profile[1]+'</small></td><td>'+r.profile[2]+'<small>'+r.profile[4]+'</small></td><td>'+r.generated+'</td><td>'+fmt(r.views)+'</td><td>'+fmt(r.favorites)+'</td></tr>').join('')||'<tr><td colspan="6"><div class="rv-empty">暂无匹配内容</div></td></tr>';
      ui.querySelectorAll('[data-sort]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sort===sort)));
      ui.querySelectorAll('[data-teacher]').forEach(b=>b.onclick=()=>{activeTeacher=Number(b.dataset.teacher);dialogPage=0;lastTrigger=b;renderDialog();dialog.showModal()});
      const grouped=themes.map(theme=>{const entries=base.filter(w=>w.theme===theme[0]);return {theme,entries,teachers:new Set(entries.map(w=>w.teacher)),schools:new Set(entries.map(w=>profiles[w.teacher][1]))}}).filter(g=>g.entries.length).sort((a,b)=>b.teachers.size-a.teachers.size||b.entries.length-a.entries.length);
      const topicPages=Math.ceil(grouped.length/3);topicPage=Math.min(topicPage,Math.max(0,topicPages-1));ui.querySelector('#rv-topics').innerHTML=grouped.slice(topicPage*3,(topicPage+1)*3).map(g=>'<button type="button" class="rv-topic" aria-pressed="'+(topic===g.theme[0])+'" data-topic="'+g.theme[0]+'"><small>'+g.theme[2]+' · '+g.theme[1]+'</small><strong>'+g.theme[0]+'</strong><p>'+g.theme[3]+' · '+g.theme[4]+'</p><span class="rv-tags">'+g.teachers.size+' 位教师 · '+g.schools.size+' 所学校 · '+g.entries.length+' 个作品</span></button>').join('')||'<div class="rv-empty">暂无创作主题</div>';
      ui.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=topic===b.dataset.topic?'':b.dataset.topic;page=0;render()});ui.querySelector('#rv-topic-count').textContent=grouped.length+' 个主题';ui.querySelector('#rv-selection').textContent=topic?'已关联：'+topic+' · 再次点击取消':'';paginate('rv-topic',topicPage,topicPages);if(dialog.open)renderDialog();
    }
    function renderDialog(){const profile=profiles[activeTeacher],records=selectedWorks().filter(w=>w.teacher===activeTeacher);dialogPage=Math.min(dialogPage,Math.max(0,Math.ceil(records.length/4)-1));dialog.querySelector('h3').textContent=profile[0]+' · '+profile[2]+'作品';dialog.querySelector('.rv-dialog-body').innerHTML=records.slice(dialogPage*4,(dialogPage+1)*4).map(w=>'<article class="rv-work"><strong>'+w.title+'</strong><small>'+w.format+' · '+w.date+'</small><p>'+w.description+'</p><small>被查看 '+w.views+' 次　被收藏 '+w.favorites+' 次</small></article>').join('')||'<div class="rv-empty">当前筛选下暂无作品</div>';dialog.querySelector('#rv-work-count').textContent=profile[1]+' · '+records.length+' 个作品';dialog.querySelector('#rv-work-page').textContent=(dialogPage+1)+' / '+Math.max(1,Math.ceil(records.length/4));dialog.querySelector('#rv-work-prev').disabled=dialogPage===0;dialog.querySelector('#rv-work-next').disabled=(dialogPage+1)*4>=records.length;}
    dialog.querySelector('#rv-close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>lastTrigger?.isConnected&&lastTrigger.focus());dialog.querySelector('#rv-work-prev').onclick=()=>{dialogPage--;renderDialog()};dialog.querySelector('#rv-work-next').onclick=()=>{dialogPage++;renderDialog()};
    // research-filter-transaction:start
    const appliedFilters=['','',''];
    const filterEditor=ui.querySelector('#rv-filter-editor'),filterOpen=ui.querySelector('#rv-filter-open');
    function closeFilter(){filterEditor.hidden=true;filterOpen.setAttribute('aria-expanded','false');filterOpen.focus()}
    function cancelFilter(){selectors.forEach((s,i)=>s.value=appliedFilters[i]);closeFilter()}
    filterOpen.onclick=()=>{if(!filterEditor.hidden){cancelFilter();return}selectors.forEach((s,i)=>s.value=appliedFilters[i]);filterEditor.hidden=false;filterOpen.setAttribute('aria-expanded','true');selectors[0].focus()};
    ui.querySelector('#rv-filter-cancel').onclick=cancelFilter;
    ui.querySelector('#rv-filter-apply').onclick=()=>{const next=selectors.map(s=>s.value),changed=next.some((v,i)=>v!==appliedFilters[i]);appliedFilters.splice(0,3,...next);ui.querySelector('#rv-filter-summary').textContent=appliedFilters.map((v,i)=>v||['全部年级','全部学科','全部学校'][i]).join(' · ');closeFilter();if(changed){topic='';page=topicPage=0;render()}};
    filterEditor.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();cancelFilter()}});
    // research-filter-transaction:end
    ui.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sort=b.dataset.sort;page=0;render()});ui.querySelector('#rv-topic-prev').onclick=()=>{topicPage--;render()};ui.querySelector('#rv-topic-next').onclick=()=>{topicPage++;render()};
    ['date-start','date-end'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{topic='';page=topicPage=0;render()}));
    render();
  })();
  <\/script></body>`);
  // regional-research-workbench:end
  const initialParams = new URLSearchParams(window.location.search);
  if (initialParams.get('view') === 'school') {
    window.currentSchool = initialParams.get('school') || window.currentSchool;
    window.showView('school', window.currentSchool);
  } else {
    document.getElementById('view').srcdoc = pages.regional;
  }
</script>
