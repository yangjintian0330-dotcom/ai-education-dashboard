    .amap-toolbar,.amap-toolbar .amap-zoomcontrol,.amap-toolbar .amap-zoomcontrol-plus,.amap-toolbar .amap-zoomcontrol-minus,.amap-toolbar .amap-toolbar-control{border-color:rgba(207,217,232,.32)!important;background:#3a4250!important;box-shadow:0 8px 18px rgba(0,0,0,.32)!important;transition:background .16s,border-color .16s!important}\n    .amap-toolbar .amap-zoomcontrol-plus,.amap-toolbar .amap-zoomcontrol-minus{color:#f3f6fb!important}\n    .amap-toolbar .amap-zoomcontrol-plus:hover,.amap-toolbar .amap-zoomcontrol-minus:hover,.amap-toolbar .amap-toolbar-control:hover{border-color:rgba(255,255,255,.72)!important;background:#5a6575!important}\n    .amap-toolbar div:hover,.amap-toolbar a:hover{background:#5a6575!important;color:#f5f7fb!important}\n    .amap-toolbar img{filter:grayscale(1) contrast(1.15) brightness(2.25)!important}\n\n    @keyframes pulse{0%,100%{transform:scale(.82)}50%{transform:scale(1.28)}}\n    html.presentation-fullscreen,html.presentation-fullscreen body{min-width:0;min-height:0;overflow:hidden}\n    html.presentation-fullscreen .screen{position:absolute;top:50%;left:50%;margin:0;transform:translate(-50%,-50%) scale(var(--fit-scale,1));transform-origin:center}\n    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}\n  </style>\n</head>\n<body>\n  <main class=\"screen\">\n    <header class=\"top\">\n      <div class=\"controls\">\n        <button class=\"range on\" data-days=\"7\">7 天</button><button class=\"range\" data-days=\"30\">30 天</button><button class=\"range\" data-days=\"90\">90 天</button>\n      </div>\n      <div class=\"title\"><h1>上海市虹口区 <b>AI+ 教育</b> 智能体导航</h1></div>\n      <button id=\"fullscreen\" class=\"fullscreen\" aria-label=\"全屏展示\" title=\"全屏展示\">⛶</button>\n    </header>\n\n    <section class=\"metrics\">\n      <div class=\"metric\"><strong id=\"schools\">153</strong><em>所</em><span>使用学校数<i>↑ 8.5%</i></span></div>\n      <div class=\"metric\"><strong id=\"teachers\">752</strong><em>人</em><span>活跃老师数<i>↑ 12.3%</i></span></div>\n      <div class=\"metric\"><strong id=\"services\">104,752</strong><em>次</em><span>AI 对话次数<i>↑ 23.4%</i></span></div>\n    </section>\n\n    <section class=\"grid\">\n      <aside class=\"side\">\n        <article class=\"panel trend\">\n          <div class=\"phead\"><h2>区域使用趋势</h2><div class=\"tabset\"><button class=\"on\" data-mode=\"student\">学生</button><button data-mode=\"teacher\">教师</button></div></div>\n          <div id=\"trend\" class=\"chart\"></div>\n        </article>\n        <article class=\"panel capability\">\n          <div class=\"phead\"><h2>高频 AI 能力</h2><label id=\"cap-period\">近 7 天 · 次数 / 占比</label></div>\n          <div id=\"cap-list\" class=\"cap-list\"></div>\n        </article>\n      </aside>\n\n      <section class=\"command\">\n        <div class=\"map-shell\">\n          <div id=\"amap\" class=\"amap\"></div>\n          <div class=\"map-label\">飞象老师校园版实时活跃</div>\n          <div class=\"map-stats\"><strong>18</strong><div><b>所中学</b><span>实时活跃</span></div></div>\n          <a class=\"map-panorama\" href=\"#\" onclick=\"parent.showView('future');return false\" aria-label=\"进入虹口区 AI 教育未来城全景\">看全景 <span aria-hidden=\"true\">↗</span></a>\n          <div id=\"link-feed\" class=\"link-feed\"></div>\n        </div>\n        <div class=\"ledger\">\n          <article class=\"panel rank\"><div class=\"phead\"><h2>学校累计创作指数</h2></div><div id=\"school-rank\" class=\"rank-list\"></div></article>\n          <article class=\"panel rank\"><div class=\"phead\"><h2>教师资源贡献榜</h2></div><div id=\"teacher-rank\" class=\"rank-list\"></div></article>\n        </div>\n      </section>\n\n      <aside class=\"side\">\n        <article class=\"panel usage\"><div class=\"phead\"><h2>区域热门 AI 应用</h2></div><div id=\"hot-apps\" class=\"hot-apps\"></div></article>\n        <article class=\"panel resource-panel subject\"><div class=\"phead\"><h2>区域资源类型雷达</h2><label id=\"type-total\"></label></div><div class=\"subject-body\"><div id=\"type-chart\" class=\"subject-chart\"></div><div id=\"type-legend\" class=\"legend\"></div></div></article>\n        <article class=\"panel resource-panel resource-subject\"><div class=\"phead\"><h2>区域资源学科雷达</h2><label>按学科分类 · 份</label></div><div id=\"subject-chart\" class=\"resource-subject-chart\"></div></article>\n      </aside>\n    </section>\n  </main>\n  <div id=\"floating\" class=\"floating\"></div>\n\n  <script>\n    const $ = id => document.getElementById(id);\n    const fmt = value => Math.round(value).toLocaleString();\n    const today = new Date();\n    today.setHours(0, 0, 0, 0);\n    const data = Array.from({length: 90}, (_, index) => {\n      const date = new Date(today);\n      date.setDate(today.getDate() - 89 + index);\n      const student = Math.max(1300, 3000 + Math.round(Math.sin(index / 7) * 840 + index * 14 + (index % 7) * 170));\n      const teacher = Math.max(90, 205 + Math.round(Math.sin(index / 4.8) * 48 + Math.cos(index / 10) * 26 + index * 2.15 + (index % 6) * 11));\n      return {date, student, teacher, services: Math.round(student * 5.65)};\n    });\n    const capabilityBase = [\n      ['AI 生成题目', 386, '#2dd4b5'], ['AI 生成动画', 324, '#32c5f4'], ['知识库问答', 308, '#f8b840'],\n      ['AI 生成游戏', 268, '#e27090'], ['AI 生成课件', 256, '#9e82ff'], ['AI 分析作文', 228, '#2dd4b5']\n    ];\n    const appsBase = [\n      ['虹智 AI 作文陪练', 36146, '作文构思、分层陪练与表达提升使用最集中。'],\n      ['智能作业批改', 29229, '语文与数学作业是最主要场景。'],\n      ['几何助教', 10605, '几何图形推演、辅助作图与错题讲解最活跃。'],\n      ['拍照答疑', 9652, '晚间时段的错题提问更集中。'],\n      ['AI 视频讲解', 6946, '重点服务难题复盘和知识点巩固。']\n    ];\n    const schools = [\n      ['上海市钟山初级中学',121.4698,31.2915],['上海市江湾初级中学',121.4814,31.3022],['上海市复兴实验中学',121.4758,31.2724],['上海市虹口区教育学院实验中学',121.4959,31.2841],['上海市第五中学',121.5010,31.3090],['上海市曲阳第二中学',121.5008,31.2940],['上海市虹口区教育学院附属中学',121.4680,31.2740],['上海市北虹初级中学',121.4720,31.2940],['上海市海南中学',121.4924,31.2897],['上海市丰镇中学',121.4847,31.3096],['上海市澄衷初级中学',121.4996,31.2686],['上海市鲁迅初级中学',121.4818,31.2662],['上海市继光初级中学',121.4629,31.2741],['华东师范大学第一附属初级中学',121.4852,31.2778],['上海外国语大学附属外国语学校(初中)',121.4760,31.2740],['上海市第五十二中学(初中)',121.5070,31.2795],['上海外国语大学附属外国语学校东校',121.4790,31.2670],['上海市北郊学校(初中)',121.4999,31.3052],['上海市霍山学校(初中)',121.4750,31.2680],['上海市长青学校',121.4780,31.2590],['上海市培华学校',121.4640,31.2810],['上海市虹口实验学校',121.4860,31.2870],['上海市虹口区密云学校',121.4800,31.2840]\n    ];\n    let mode = 'student';\n    let activeDays = 7;\n    let trendChart, typeChart, subjectChart;\n\n    function selectedData() { return data.slice(-activeDays); }\n    function scaleFor(days) { return .5 + Math.min(1, days / 90) * .5; }\n    function animateNumber(id, target) {\n      const element = $(id);\n      const from = Number(element.dataset.value || 0);\n      const start = performance.now();\n      element.dataset.value = target;\n      const step = now => {\n        const progress = Math.min(1, (now - start) / 650);\n        element.textContent = fmt(from + (target - from) * (1 - Math.pow(1 - progress, 3)));\n        if (progress < 1) requestAnimationFrame(step);\n      };\n      requestAnimationFrame(step);\n    }\n    function floatingAt(event, title, value, body, tag = '数据洞察') {\n      const card = $('floating');\n      card.innerHTML = `<small>${tag}</small><b>${title}<i>${value}</i></b><p>${body}</p>`;\n      const width = 318;\n      card.style.left = `${Math.max(14, Math.min(event.clientX + 16, innerWidth - width - 14))}px`;\n      card.style.top = `${Math.max(14, Math.min(event.clientY - 20, innerHeight - 180))}px`;\n      card.classList.add('show');\n    }\n    function hideFloating() { $('floating').classList.remove('show'); }\n\n    function renderCapabilities(period, scale) {\n      const values = capabilityBase.map(([name, value, color], index) => [name, Math.round(value * scale * (1 + (index - 2) * .012)), color]);\n      const max = Math.max(...values.map(([, value]) => value));\n      const total = values.reduce((sum, [, value]) => sum + value, 0);\n      $('cap-period').textContent = `${period} · 次数 / 占比`;\n      $('cap-list').innerHTML = values.map(([name, value, color], index) => `\n        <div class=\"cap-row\" data-index=\"${index}\">\n          <span class=\"cap-order\">0${index + 1}</span><span class=\"cap-name\">${name}</span>\n          <i class=\"cap-track\"><b class=\"cap-fill\" style=\"--color:${color};width:${Math.round(value / max * 100)}%\"></b></i>\n          <span class=\"cap-value\"><b>${fmt(value)}</b>次 · ${Math.round(value / total * 100)}%</span>\n        </div>`).join('');\n      document.querySelectorAll('.cap-row').forEach((row, index) => {\n        row.onmouseenter = event => floatingAt(event, values[index][0], row.querySelector('.cap-value').textContent.trim(), `${period}累计数据；${['主要用于单元测评与分层练习。','课前导入与知识可视化使用最集中。','主要来自数学、语文与外语学科问答。','已有教学游戏进入学校资源广场。','已有课件进入学校资源广场。','作文批注与写作评价是主要场景。'][index]}`, '能力数据简报');\n        row.onmousemove = event => floatingAt(event, values[index][0], row.querySelector('.cap-value').textContent.trim(), `${period}累计数据`, '能力数据简报');\n        row.onmouseleave = hideFloating;\n      });\n    }\n    function renderApps(period, scale) {\n      const values = appsBase.map(([name, value, copy], index) => [name, Math.round(value * scale * (1 + (index - 2) * .018)), copy]);\n      $('hot-apps').innerHTML = values.map(([name, value], index) => `\n        <div class=\"hot-app ${index === 0 ? 'hot-main' : ''}\" data-index=\"${index}\">\n          <span class=\"hot-rank\">${index === 0 ? '热门应用 01' : `0${index + 1}`}</span><span class=\"hot-name\">${name}</span>\n          <b class=\"hot-value\">${fmt(value)}<small>次</small></b>\n        </div>`).join('');\n      document.querySelectorAll('.hot-app').forEach((card, index) => {\n        const [name, value, copy] = values[index];\n        card.onmouseenter = event => floatingAt(event, name, `${fmt(value)} 次`, `${period}累计使用；${copy}`, '区域应用热度');\n        card.onmousemove = event => floatingAt(event, name, `${fmt(value)} 次`, `${period}累计使用；${copy}`, '区域应用热度');\n        card.onmouseleave = hideFloating;\n      });\n    }\n    function resourceTooltip(tag, title, value, copy) {\n      return `<span class=\"tip-tag\">${tag}</span><div class=\"tip-title\">${title}<i class=\"tip-value\">${value}</i></div><div>${copy}</div>`;\n    }\n    function updateResources(days) {\n      const scale = .82 + Math.min(1, days / 90) * .18;\n      const typeNames = ['题单', 'WIKI', '文件', '应用', '课件'];\n      const typeColors = ['#9e82ff', '#32c5f4', '#f8de58', '#d66ac5', '#2dd4b5'];\n      const typeValues = [2860, 1840, 1360, 920, 780].map((value, index) => Math.round(value * scale * (1 + (index - 2) * .015)));\n      const typeTotal = typeValues.reduce((sum, value) => sum + value, 0);\n      $('type-total').textContent = `${fmt(typeTotal)} 份`;\n      $('type-legend').innerHTML = typeNames.map((name, index) => `<span>${name} ${fmt(typeValues[index])}</span>`).join('');\n      typeChart.setOption({\n        title: {text: fmt(typeTotal)},\n        series: [{data: typeNames.map((name, index) => ({name, value: typeValues[index], itemStyle: {color: typeColors[index]}}))}]\n      });\n      const profiles = {\n        7: [2080,2140,2010,1860,2820,2980,1740,1680],\n        30: [2360,2980,2440,2150,2090,2230,1810,1650],\n        90: [3000,2640,2520,2280,2200,2390,1940,1810]\n      };\n      const profile = days <= 18 ? 7 : days <= 60 ? 30 : 90;\n      const subjectNames = ['语文','数学','外语','物理','化学','跨学科案例分析','道德与法治','历史'];\n      const values = profiles[profile];\n      const total = values.reduce((sum, value) => sum + value, 0);\n      const leaderIndex = values.indexOf(Math.max(...values));\n      const conclusion = profile === 7 ? '跨学科案例分析与化学在短周期内活跃度最高。' : profile === 30 ? '数学在月度资源沉淀中占据主导。' : '语文在季度资源沉淀中占据主导。';\n      subjectChart.setOption({\n        tooltip: {formatter: () => resourceTooltip('学科资源洞察', '区域资源学科分布', `共 ${fmt(total)} 份`, `近 ${days} 天内，<strong>${subjectNames[leaderIndex]}</strong>资源沉淀最突出，为 <strong>${fmt(values[leaderIndex])}</strong> 份。<br/>${conclusion}`)},\n        series: [{data: [{value: values}]}]\n      });\n    }\n    function renderRanks(scale) {\n      const schoolRows = [\n        ['虹口区实验学校', '已累计沉淀 42 项资源：4 个教学应用、17 份题单、12 套课件及 9 份校本文件。'],\n        ['上海市鲁迅初级中学', '已累计沉淀 38 项资源，其中「错因追踪」应用被 7 所学校复用。'],\n        ['上海市北郊学校', '已累计沉淀 31 项跨学科资源包，覆盖课件、任务单与课堂活动。'],\n        ['教育学院实验中学', '已累计沉淀 29 项科学探究资源，「实验报告生成器」覆盖多个年级。'],\n        ['上海市继光初级中学', '已累计沉淀 26 项知识库问答与课堂讲解资源。'],\n        ['上海市丰镇中学', '已累计沉淀 22 项英语教学资源，含游戏、题单和评价量表。']\n      ];\n      const teachers = [\n        ['王红敏 · 虹口实验',42,'古诗文闯关','9.6 万','1.8 万'],['刘国顺 · 鲁迅初中',38,'错因追踪','6.5 万','1.2 万'],\n        ['陈欣 · 北郊学校',31,'项目式学习资源包','5.8 万','0.9 万'],['黄婷婷 · 继光初中',29,'课堂讲解知识库','4.9 万','0.8 万'],\n        ['廖钦尧 · 丰镇中学',26,'词汇大闯关','4.2 万','0.7 万'],['赵老师 · 江湾初中',22,'作文批注模板','3.8 万','0.6 万']\n      ];\n      $('school-rank').innerHTML = schoolRows.map(([name, note], index) => {\n        const stars = 5 - Math.floor(index / 2);\n        return `<div class=\"rank-row\" data-note=\"${note}\" data-name=\"${name}\" data-value=\"${stars} 星资源沉淀\"><span class=\"rank-num\">${index + 1}</span><span class=\"rank-name\">${name}</span><span class=\"rank-stars\">${Array.from({length:5}, (_, star) => `<i class=\"${star < stars ? 'on' : ''}\">★</i>`).join('')}</span></div>`;\n      }).join('');\n      $('teacher-rank').innerHTML = teachers.map(([name, amount, work, views, favorites], index) => {\n        const value = Math.round(amount * scale);\n        return `<div class=\"rank-row\" data-name=\"${name}\" data-value=\"${value} 份\" data-note=\"累计沉淀 ${value} 份资源。\" data-work=\"${work}\" data-views=\"${views}\" data-favorites=\"${favorites}\"><span class=\"rank-num\">${index + 1}</span><span class=\"rank-name\">${name}</span><span class=\"rank-value\">${value}份</span></div>`;\n      }).join('');\n      document.querySelectorAll('.rank-row').forEach(row => {\n        row.onmouseenter = event => {\n          const extra = row.dataset.work ? `<br/>最热门作品：<strong>${row.dataset.work}</strong><br/>浏览 ${row.dataset.views} · 收藏 ${row.dataset.favorites}` : '';\n          floatingAt(event, row.dataset.name, row.dataset.value, `${row.dataset.note}${extra}`, row.dataset.work ? '教师资源贡献画像' : '学校累计创作画像');\n        };\n        row.onmousemove = event => floatingAt(event, row.dataset.name, row.dataset.value, row.dataset.note, '资源画像');\n        row.onmouseleave = hideFloating;\n      });\n    }\n    function updateDashboard() {\n      const rows = selectedData();\n      if (!rows.length) return;\n      const days = rows.length;\n      const scale = scaleFor(days);\n      const period = `近 ${days} 天`;\n      animateNumber('schools', 153 * Math.max(.35, Math.min(1, days / 30)));\n      animateNumber('teachers', 752 * Math.max(.35, Math.min(1, days / 30)));\n      animateNumber('services', rows.reduce((sum, row) => sum + row.services, 0));\n      trendChart.setOption({xAxis: {data: rows.map(row => `${row.date.getMonth()+1}.${row.date.getDate()}`)}, series: [{data: rows.map(row => row[mode])}]});\n      renderCapabilities(period, scale);\n      renderApps(period, scale);\n      updateResources(days);\n      renderRanks(scale);\n    }\n    function setRange(days) {\n      activeDays = days;\n      document.querySelectorAll('.range').forEach(button => button.classList.toggle('on', Number(button.dataset.days) === days));\n      updateDashboard();\n    }\n    function initCharts() {\n      trendChart = echarts.init($('trend'));\n      trendChart.setOption({\n        animationDuration: 450,\n        tooltip: {trigger:'axis', backgroundColor:'rgba(12,20,48,.96)', borderColor:'rgba(76,195,255,.62)', borderWidth:1, textStyle:{color:'#edf5ff',fontSize:10}, formatter: points => `<b>${points[0].axisValue}</b><br/>${mode === 'student' ? '学生' : '教师'}使用人数：<b>${fmt(points[0].data)} 人</b>`},\n        grid:{left:30,right:10,top:16,bottom:25},\n        xAxis:{type:'category',axisLabel:{color:'rgba(212,225,255,.43)',fontSize:9},axisTick:{show:false},axisLine:{lineStyle:{color:'rgba(107,152,232,.2)'}}},\n        yAxis:{type:'value',axisLabel:{color:'rgba(212,225,255,.35)',fontSize:9,formatter:value => value >= 1000 ? `${Math.round(value / 1000)}k` : value},splitLine:{lineStyle:{color:'rgba(107,152,232,.12)'}}},\n        series:[{type:'line',smooth:true,symbol:'none',lineStyle:{width:2,color:'#32c5f4'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(50,197,244,.3)'},{offset:1,color:'rgba(50,197,244,0)'}])},data:[]}]\n      });\n      typeChart = echarts.init($('type-chart'));\n      typeChart.setOption({\n        animationDuration: 420,\n        tooltip:{trigger:'item',appendToBody:false,confine:false,className:'resource-tip',backgroundColor:'transparent',borderWidth:0,padding:0,formatter: point => resourceTooltip('资源类型洞察', point.name, `${fmt(point.value)} 份`, `占区域资源总量的 <strong>${point.percent}%</strong><br/>${{题单:'面向分层练习与课堂测评，是区域沉淀最完整的资源形态。',WIKI:'沉淀教学知识与学科问答，支持教师快速复用。',文件:'包含校本资料、教案与评价量表等结构化文件。',应用:'由教师自主创作的互动工具，持续进入学校资源广场。',课件:'覆盖课堂导入、知识讲解与课后复习的教学课件。'}[point.name]}`)},\n        title:{text:'',subtext:'份资源',left:'center',top:'31%',textStyle:{color:'#f1f5ff',fontSize:19,fontWeight:700},subtextStyle:{color:'rgba(225,235,255,.52)',fontSize:9}},\n        series:[{type:'pie',radius:['56%','77%'],center:['50%','50%'],label:{show:false},data:[]}]\n      });\n      subjectChart = echarts.init($('subject-chart'));\n      subjectChart.setOption({\n        animationDuration: 500,\n        tooltip:{trigger:'item',appendToBody:false,confine:false,className:'resource-tip',backgroundColor:'transparent',borderWidth:0,padding:0},\n        radar:{center:['50%','54%'],radius:'57%',indicator:['语文','数学','外语','物理','化学','跨学科案例分析','道德与法治','历史'].map(name => ({name,max:3000})),axisName:{color:'rgba(220,235,255,.72)',fontSize:8},splitArea:{areaStyle:{color:['rgba(60,88,169,.04)','rgba(60,88,169,.08)']}},splitLine:{lineStyle:{color:'rgba(112,155,245,.2)'}},axisLine: ,10,30,.66);color:#f1fbff;font:600 13px/1.35 \"Noto Sans SC\",sans-serif;letter-spacing:.45px;text-align:center;text-shadow:0 0 11px var(--c),0 2px 4px #020817;opacity:.94;transition:opacity .42s,background .42s;pointer-events:none;white-space:nowrap}.tower.hot .school-mini{font-size:15px;padding:4px 9px;background:rgba(5,28,70,.82);box-shadow:0 0 16px color-mix(in srgb,var(--c),transparent 70%)}.tower.idle .school-mini{opacity:.56}.tower:hover,.tower.selected{transform:translate(-10px,-18px) scale(1.62);filter:drop-shadow(0 0 24px var(--c)) brightness(1.7);opacity:1}.tower.selected .school-mini{padding:4px 9px;background:rgba(5,24,63,.94);opacity:1}@keyframes beam-breathe-hot{0%,100%{transform:perspective(45px) rotateX(12deg) scaleY(.84)}50%{transform:perspective(45px) rotateX(12deg) scaleY(1.14)}}@keyframes beam-breathe-active{0%,100%{transform:perspective(45px) rotateX(12deg) scaleY(.92)}50%{transform:perspective(45px) rotateX(12deg) scaleY(1.07)}}@keyframes ring{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.7);opacity:0}}\n    .school-event-anchor{width:max-content;pointer-events:none}.school-event-anchor.side-right{transform:translateX(112px)}.school-event-anchor.side-left{transform:translateX(calc(-100% - 112px))}.school-event-capsule{position:relative;width:max-content;max-width:250px;padding:9px 13px 9px 15px;border:1px solid color-mix(in srgb,var(--event-color),transparent 34%);border-left:3px solid var(--event-color);border-radius:2px 11px 11px 2px;background:rgba(3,15,38,.9);box-shadow:0 10px 30px rgba(0,0,0,.38),0 0 22px color-mix(in srgb,var(--event-color),transparent 66%);color:#eaf8ff;pointer-events:none;animation:event-capsule-life 3.4s cubic-bezier(.2,.72,.2,1) both}.school-event-capsule::before{content:\"\";position:absolute;left:-7px;top:50%;width:8px;height:8px;border-left:1px solid var(--event-color);border-bottom:1px solid var(--event-color);background:rgba(3,15,38,.9);transform:translateY(-50%) rotate(45deg)}.school-event-anchor.side-left .school-event-capsule{border-left-width:1px;border-right:3px solid var(--event-color);border-radius:11px 2px 2px 11px}.school-event-anchor.side-left .school-event-capsule::before{left:auto;right:-7px;border:0;border-top:1px solid var(--event-color);border-right:1px solid var(--event-color)}.school-event-capsule span{display:block;margin-bottom:4px;color:var(--event-color);font:600 8px/1 ui-monospace,monospace;letter-spacing:1.3px;text-shadow:0 0 9px var(--event-color)}.school-event-capsule strong{display:block;font:600 12px/1.35 \"Noto Sans SC\",\"PingFang SC\",sans-serif;letter-spacing:.2px;white-space:nowrap}@keyframes event-capsule-life{0%{opacity:0;transform:translate3d(-10px,9px,0) scale(.92);filter:blur(4px)}14%,78%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}100%{opacity:0;transform:translate3d(8px,-5px,0) scale(.98);filter:blur(2px)}}@media(prefers-reduced-motion:reduce){.school-event-capsule{animation:event-capsule-still 3.4s linear both}@keyframes event-capsule-still{0%,100%{opacity:0}10%,90%{opacity:1}}}\n    .school-card{width:258px;padding:16px 17px 14px;border:1px solid rgba(79,218,255,.68);border-left:3px solid var(--blue);background:linear-gradient(135deg,rgba(16,38,80,.97),rgba(4,10,27,.96));box-shadow:0 18px 48px rgba(0,0,0,.55);color:#ecf8ff}.school-card .tag{color:var(--blue);font:500 10px ui-monospace,monospace;letter-spacing:1.5px}.school-card h3{margin:8px 0 13px;font-size:15px;font-weight:500}.school-card .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;border-top:1px solid rgba(122,193,255,.18);padding-top:11px}.school-card span{display:block;color:var(--dim);font-size:10px}.school-card b{display:block;margin-top:3px;color:#fff;font:500 18px ui-monospace,monospace}.school-card button{width:100%;margin-top:13px;padding:8px;border:1px solid rgba(104,217,255,.48);background:rgba(50,161,239,.12);color:#dff7ff;cursor:pointer;font:500 11px \"Noto Sans SC\",sans-serif}.school-card button:hover{background:rgba(50,161,239,.3)}\n    .school-card .card-close{position:absolute;top:8px;right:8px;width:22px;height:22px;margin:0;border:1px solid rgba(132,216,255,.42);border-radius:50%;padding:0;background:rgba(7,25,59,.68);color:#dff7ff;font:400 17px/18px ui-sans-serif,sans-serif;cursor:pointer}.school-card .card-close:hover{background:rgba(74,176,255,.32);border-color:#9beaff}\n    .hub{display:none}\n    @media(max-width:720px){header{padding:20px 20px 0;height:100px}.title{font-size:20px;letter-spacing:3px}.live-counter{right:18px;width:250px}.live-feed{width:230px}.metrics{left:20px;bottom:20px;gap:11px}.metric{min-width:76px;padding-left:8px}.metric b{font-size:22px}.metric .metric-unit{margin-left:3px;font-size:10px}.zoom-controls{right:14px;bottom:18px}.clock{font-size:9px}.clock strong{font-size:15px}}\n  </style>\n</head>\n<body>\n  <div id=\"map\" aria-label=\"虹口区人工智能教育未来城三维地图\"></div>\n  <nav class=\"zoom-controls\" aria-label=\"地图层级缩放\"><button id=\"zoom-in\" type=\"button\" aria-label=\"放大地图\">+</button><button id=\"zoom-out\" type=\"button\" aria-label=\"缩小地图\">−</button></nav>\n  <header><div><h1 class=\"title\">虹口区 <span>人工智能教育未来城</span></h1></div><div class=\"clock\"><strong id=\"time\">--:--:--</strong></div></header>\n  <button id=\"return-region\" class=\"back-to-region\" type=\"button\">← 返回区域驾驶舱</button>\n  <button id=\"return-overview\" hidden aria-hidden=\"true\"></button>\n  <aside class=\"live-counter\"><div class=\"radar-core\"><i class=\"radar-sweep\"></i><i class=\"radar-orbit\"></i><i class=\"radar-orbit second\"></i><strong>18</strong><b>所</b></div><small>学校正在活跃</small><div id=\"live-feed\" class=\"live-feed\" aria-label=\"学校实时动态\" aria-live=\"polite\"></div></aside>\n  <section class=\"metrics\"><div class=\"metric\"><b id=\"school-count\">23</b><i class=\"metric-unit\">所</i><span>接入学校节点</span></div><div class=\"metric\"><b id=\"teacher-count\">752</b><i class=\"metric-unit\">位</i><span>活跃教师</span></div><div class=\"metric\"><b id=\"student-count\">18,968</b><i class=\"metric-unit\">名</i><span>服务学生</span></div><div class=\"metric\"><b id=\"service-count\">104,752</b><i class=\"metric-unit\">次</i><span>人工智能服务调用</span></div></section>\n  <script>\n    const schools=[['钟山初级中学',121.4698,31.2915],['江湾初级中学',121.4814,31.3022],['复兴实验中学',121.4758,31.2724],['教育学院实验中学',121.4959,31.2841],['第五中学',121.501,31.309],['曲阳第二中学',121.5008,31.294],['教育学院附属中学',121.468,31.274],['北虹初级中学',121.472,31.294],['海南中学',121.4924,31.2897],['丰镇中学',121.4847,31.3096],['澄衷初级中学',121.4996,31.2686],['鲁迅初级中学',121.4818,31.2662],['继光初级中学',121.4629,31.2741],['华师大一附初级中学',121.4852,31.2778],['上外附外初中',121.476,31.274],['第五十二中学',121.507,31.2795],['上外附外东校',121.479,31.267],['北郊学校',121.4999,31.3052],['霍山学校',121.475,31.268],['长青学校',121.478,31.259],['培华学校',121.464,31.281],['虹口实验学校',121.486,31.287],['密云学校',121.48,31.284]];\n    const capability=[['人工智能生成题目',386],['人工智能生成动画',324],['知识库问答',308],['人工智能生成游戏',268],['人工智能生成课件',256],['人工智能分析作文',228]];\n    const apps=[['虹智人工智能作文陪练',36146],['智能作业批改',29229],['几何助教',10605],['拍照答疑',9652],['人工智能视频讲解',6946]];\n    const resourceTypes=[['题单',2860],['知识库',1840],['文件',1360],['应用',920],['课件',780]];\n    const subjectProfiles={7:['语文',2080,'数学',2140,'外语',2010,'物理',1860,'化学',2820,'跨学科案例分析',2980],30:['语文',2360,'数学',2980,'外语',2440,'物理',2150,'化学',2090,'跨学科案例分析',2230],90:['语文',3000,'数学',2640,'外语',2520,'物理',2280,'化学',2200,'跨学科案例分析',2390]};\n    const deposits={'虹口实验学校':42,'鲁迅初级中学':38,'北郊学校':31,'教育学院实验中学':29,'继光初级中学':26,'丰镇中学':22};\n    const modes={service:{label:'人工智能服务调用',colors:['#7787ff','#46d8ff','#45f0d0'],factor:1},resource:{label:'资源复用指数',colors:['#46d8ff','#45f0d0','#8eb7ff'],factor:.74},create:{label:'教学创作热度',colors:['#8eb7ff','#7787ff','#46d8ff'],factor:.56}};\n    const liveSchools=new Set([0,1,3,4,5,7,8,10,11,12,14,15,16,17,18,20,21,22]);\n    const hotSchools=new Set([0,4,8,11,16,21]);\n    const liveEvents=[\n      ['虹口实验学校','王老师刚完成人工智能语文教学设计','#8d7dff'],\n      ['江湾初级中学','八年级正在使用人工智能讲解错题','#46d8ff'],\n      ['教育学院实验中学','科学实验报告已发布','#45f0d0'],\n      ['北郊学校','新增 4 份互动课件','#8eb7ff'],\n      ['继光初级中学','英语词汇闯关应用完成发布','#7787ff'],\n      ['鲁迅初级中学','作文智能批阅任务已完成','#46d8ff'],\n      ['第五中学','跨学科案例进入区域资源池','#45f0d0']\n    ];\n    const overviewCenter=[121.486,31.286];\n    let map, info, towerMarkers=[], buildingLayer, eventMarker, eventHideTimer, mode='service', activeDays=7, selectedSchool=-1, focusCardTimer, focusEndHandler, focusSequence=0;\n    function tick(){document.getElementById('time').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});}tick();setInterval(tick,1000);\n    let liveEventCursor=0;\n    function renderLiveFeed(animate=false){const feed=document.getElementById('live-feed');const visible=Array.from({length:3},(_,offset)=>liveEvents[(liveEventCursor+offset)%liveEvents.length]);feed.innerHTML=visible.map((event,index)=>`<div class=\"feed-item ${animate&&index===2?'entering':''}\" style=\"--feed-color:${event[2]}\"><div><strong>${event[0]}</strong>${event[1]}</div><time>${index===0?'刚刚':index===1?'1 分钟前':'2 分钟前'}</time></div>`).join('');if(animate)requestAnimationFrame(()=>requestAnimationFrame(()=>feed.lastElementChild?.classList.remove('entering')));}\n    function advanceLiveFeed(){liveEventCursor=(liveEventCursor+1)%liveEvents.length;renderLiveFeed(true);showSchoolEvent(liveEvents[liveEventCursor]);}\n    renderLiveFeed();setInterval(advanceLiveFeed,4800);\n    function normalized(name){return name.replace('上海市虹口区','').replace('上海市','').replace('初级中学','').replace('中学','').replace('学校','学校');}\n    function schoolDeposit(i){return deposits[schools[i][0]] || Math.max(8,18+(i*7)%21);}\n    function towerContent(i){const d=modes[mode],period=.5+activeDays/180,base=31+(i*17)%83,level=hotSchools.has(i)?'hot':liveSchools.has(i)?'active':'idle',scale=level==='hot'?1.62:level==='active'?1.12:.54,h=Math.round(base*d.factor*period*scale),c=d.colors[i%3],short=schools[i][0].replace('上海市虹口区','').replace('上海市','');return `<div class=\"tower ${level} ${selectedSchool===i?'selected':''}\" style=\"--h:${h}px;--c:${c};--delay:-${(i*.19).toFixed(2)}s\" aria-label=\"${schools[i][0]}\"><i class=\"beam\"></i><i class=\"base\"></i><i class=\"pulse\"></i><i class=\"pulse\"></i><span class=\"school-mini\">${short}</span></div>`;}\n    function eventCapsuleContent(event,index){const side=schools[index][1]>=overviewCenter[0]?'side-left':'side-right';return `<div class=\"school-event-anchor ${side}\"><div class=\"school-event-capsule\" style=\"--event-color:${event[2]}\"><span>实时 · ${event[0]}</span><strong>${event[1]}</strong></div></div>`;}\n    function showSchoolEvent(event){if(!map)return;const index=schools.findIndex(s=>s[0]===event[0]);if(index<0)return;const position=[schools[index][1],schools[index][2]],content=eventCapsuleContent(event,index);clearTimeout(eventHideTimer);if(!eventMarker){eventMarker=new AMap.Marker({position,content,anchor:'bottom-left',offset:new AMap.Pixel(0,-32),zIndex:520,clickable:false,bubble:true});eventMarker.setMap(map);}else{eventMarker.setPosition(position);eventMarker.setContent(content);eventMarker.show();}eventHideTimer=setTimeout(()=>eventMarker?.hide(),3400);}\n    function selectSchool(next){const previous=selectedSchool;selectedSchool=next;if(previous>=0&&towerMarkers[previous])towerMarkers[previous].setContent(towerContent(previous));if(next>=0&&next!==previous&&towerMarkers[next])towerMarkers[next].setContent(towerContent(next));}\n    function clearFocusWait(){clearTimeout(focusCardTimer);focusCardTimer=null;if(focusEndHandler&&map){map.off('moveend',focusEndHandler);focusEndHandler=null;}}\n    function openSchoolDashboard(name){\n      if(window.parent!==window&&typeof window.parent.showView==='function'){window.parent.showView('school',name);return;}\n      window.open('school-dashboard.html?school='+encodeURIComponent(name),'_blank','noopener');\n    }\n    function returnToRegionalDashboard(){\n      if(window.parent!==window&&typeof window.parent.showView==='function'){window.parent.showView('regional');return;}\n      if(history.length>1)history.back();\n    }\n    function card(i){const s=schools[i],teachers=20+i*3,uses=Math.round((38+i*17)*activeDays/7),resources=Math.round((46+i*13)*(.82+activeDays/500)),deposit=schoolDeposit(i),action=`<button type=\"button\" onclick='openSchoolDashboard(${JSON.stringify(s[0])})'>进入学校驾驶舱 →</button>`;return `<article class=\"school-card\"><button class=\"card-close\" onclick=\"closeSchoolCard()\" aria-label=\"关闭学校详情\">×</button><span class=\"tag\">学校节点 / ${String(i+1).padStart(2,'0')}</span><h3>${s[0]}</h3><div class=\"grid\"><span>活跃教师<b>${teachers}</b></span><span>${modes[mode].label}<b>${uses}</b></span><span>资源复用<b>${resources}</b></span><span>资源沉淀<b>${deposit} 项</b></span></div>${action}</article>`;}\n    function styleHongkouBuildings(){AMap.plugin('AMap.DistrictSearch',()=>{const search=new AMap.DistrictSearch({extensions:'all',level:'district',subdistrict:0});search.search('虹口区',(status,result)=>{const boundaries=result?.districtList?.[0]?.boundaries||[];if(status!=='complete'||!boundaries.length)return;buildingLayer.setStyle({hideWithoutStyle:false,areas:boundaries.map(path=>({path,rejectTexture:true,color1:'ff1e4a8e',color2:'ff061438'}))});const districtTint=boundaries.map(path=>new AMap.Polygon({path,strokeOpacity:0,fillColor:'#2467e8',fillOpacity:.14,zIndex:70,bubble:true}));const edge=boundaries.map(path=>new AMap.Polygon({path,strokeColor:'#78b5ff',strokeOpacity:.7,strokeWeight:1.5,fillColor:'#2461c4',fillOpacity:0,zIndex:120,bubble:true}));map.add([...districtTint,...edge]);});});}\n    function setOverviewButton(visible){document.getElementById('return-overview').classList.toggle('show',visible);}\n    function closeSchoolCard(){info?.close();}\n    function focusSchool(i){const s=schools[i],sequence=++focusSequence;clearFocusWait();setOverviewButton(true);info.close();selectSchool(i);const openCard=()=>{if(sequence!==focusSequence||selectedSchool!==i)return;clearFocusWait();info.setContent(card(i));inf le = `${school} · 飞象老师校园版`;\n  schoolTitle.replaceChildren(document.createTextNode(`${school} · `), Object.assign(document.createElement('b'), { textContent: 'AI+ 教育' }), document.createTextNode(' 驾驶舱'));\n\n  document.querySelector('.school-left').innerHTML = `\n    <article class=\"panel trend\"><div class=\"phead\"><h2>近 7 天使用趋势</h2><div class=\"tabset\"><button class=\"on\" data-mode=\"student\">学生</button><button data-mode=\"teacher\">教师</button></div></div><div id=\"trend\" class=\"chart\"></div></article>\n    <article class=\"panel apps\"><div class=\"phead\"><h2>热门 AI 应用</h2><span>使用次数</span></div><div class=\"app-list\"><div class=\"app-row\"><b class=\"app-rank\">01</b><span class=\"app-name\">智能作业批改<i><b style=\"width:100%\"></b></i></span><span class=\"app-num\">2,840<small>次</small></span></div><div class=\"app-row\"><b class=\"app-rank\">02</b><span class=\"app-name\">AI 视频课程<i><b style=\"width:85%\"></b></i></span><span class=\"app-num\">2,416<small>次</small></span></div><div class=\"app-row\"><b class=\"app-rank\">03</b><span class=\"app-name\">拍照答疑<i><b style=\"width:62%\"></b></i></span><span class=\"app-num\">1,786<small>次</small></span></div><div class=\"app-row\"><b class=\"app-rank\">04</b><span class=\"app-name\">AI 对话<i><b style=\"width:55%\"></b></i></span><span class=\"app-num\">1,554<small>次</small></span></div></div></article>\n    <article class=\"panel benchmark\"><div class=\"phead\"><h2>校区—区域对标</h2><span>近 30 天</span></div><div class=\"benchmark-head\"><span>核心指标</span><span>本校</span><span>区域</span></div><div class=\"benchmark-list\"><div class=\"benchmark-row\"><span>教师活跃率</span><b>68%</b><i>52%</i></div><div class=\"benchmark-row\"><span>资源复用率</span><b>34.6%</b><i>28.1%</i></div><div class=\"benchmark-row\"><span>人均资源沉淀</span><b>5.8</b><i>4.1</i></div><div class=\"benchmark-row\"><span>学生周使用人数</span><b>1,286</b><i>1,042</i></div></div></article>`;\n\n  document.querySelector('.grid > aside:last-child').innerHTML = `\n    <article c <script>
  // srcdoc 子页面只能通过 parent 的公开属性读取当前学校；不能依赖顶层 let 变量。
  window.currentSchool = '虹口区实验学校';
  window.showView = function (name, schoolName) {
    if (schoolName) window.currentSchool = String(schoolName);
    document.getElementById('view').srcdoc = pages[name];
  };
  // 区域地图的信息卡由高德动态插入；在捕获阶段从卡片标题取校名，
  // 避免旧版卡片内联事件读取到 window.name 而丢失真实学校名称。
  document.getElementById('view').addEventListener('load', function () {
    const frameDocument = this.contentDocument;
    if (!frameDocument) return;
    frameDocument.addEventListener('click', function (event) {
      const enter = event.target.closest('.school-enter');
      if (!enter) return;
      const schoolName = enter.closest('.school-tip')?.querySelector('h3')?.textContent.trim();
      if (!schoolName) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      window.showView('school', schoolName);
    }, true);
  });
</script>
